<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus Traffic Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div id="sidebar-wrapper" class="bg-primary">
            <div class="sidebar-heading text-white text-center py-4 fw-bold fs-4">
                🚗 Campus Traffic
            </div>
            <div class="list-group list-group-flush">
                <a href="/" class="list-group-item list-group-item-action text-white bg-primary">Live Events</a>
                <a href="/dashboard" class="list-group-item list-group-item-action text-white bg-primary">Dashboard</a>
                <a href="/residents" class="list-group-item list-group-item-action text-white bg-primary">Residents</a>
                <a href="/violations" class="list-group-item list-group-item-action text-white bg-primary">Violations</a>
                <a href="/reports" class="list-group-item list-group-item-action text-white bg-primary">Reports</a>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
                <div class="container-fluid">
                    <button class="btn btn-primary" id="menu-toggle">☰</button>
                </div>
            </nav>

            <div class="container-fluid mt-4">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Sidebar Toggle Script -->
    <script>
    document.getElementById("menu-toggle").addEventListener("click", function () {
        document.getElementById("wrapper").classList.toggle("toggled");
    });
    </script>
</body>
</html>
